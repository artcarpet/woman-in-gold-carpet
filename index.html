<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Carpet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d0d0d;
    color: #f5f5f5;
  }

  /* Navbar */
  .navbar {
    display: flex;
    align-items: stretch;
    height: 80px;
    background: #f2f2f2;
  }
  .nav-left {
    display: flex;
    align-items: center;
    padding: 0 30px;
  }
  .logo-wrap {
    position: relative;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-wrap::before {
    content: "";
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,180,0,0.55) 0%, rgba(245,180,0,0) 70%);
    animation: pulse-glow 2.5s ease-in-out infinite;
    z-index: 0;
  }
  .logo-wrap img {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 8px;
    z-index: 1;
  }
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-left: 40px;
    flex: 1;
  }
  .nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  .nav-links a:hover { color: #000; }
  .nav-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5b400;
    padding: 0 45px;
    text-decoration: none;
    color: #000;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 2px;
    font-family: 'Consolas', 'Courier New', monospace;
    white-space: nowrap;
  }
  .nav-cta:hover { background: #ffc72c; }

  /* Hero */
  .hero-wrapper {
    position: relative;
    overflow: hidden;
  }
  .hero-section {
    position: relative;
    padding: 70px 40px 40px;
    z-index: 2;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #333;
    padding: 10px 20px;
    border-radius: 4px;
    margin-bottom: 35px;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f5b400;
  }
  .badge span.label {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #f5b400;
  }
  .hero-title {
    font-size: 3rem;
    font-weight: 800;
    line-height: 1.25;
    color: #fff;
    max-width: 800px;
  }
  .hero-title .sub {
    display: block;
    color: #999;
    font-weight: 700;
  }

  /* Stats */
  .stats {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 70px;
    padding: 30px 40px 100px;
  }
  .stat-item .stat-number {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 1.3rem;
    font-weight: 800;
    color: #f5b400;
    margin-bottom: 6px;
  }
  .stat-item .stat-label {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.75rem;
    color: #fff;
    letter-spacing: 0.5px;
  }

  /* Klimt-inspired circuit line */
  .klimt-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .klimt-text {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    fill: #f5b400;
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo-wrap">
        <img src="logo.gif" alt="Art Carpet Logo">
      </div>
    </div>
    <div class="nav-links">
      <a href="#">Collections</a>
      <a href="#">Gallery</a>
    </div>
    <a href="#" class="nav-cta">Click to Buy →</a>
  </nav>

  <div class="hero-wrapper">

    <svg class="klimt-line" viewBox="0 0 1400 700" preserveAspectRatio="none">
      <polyline points="150,620 150,520 350,400 350,260 700,260 700,120 950,120"
                fill="none" stroke="#f5b400" stroke-width="1.5" opacity="0.7"/>
      <circle cx="150" cy="620" r="5" fill="none" stroke="#f5b400" stroke-width="1.5"/>
      <circle cx="950" cy="120" r="5" fill="none" stroke="#f5b400" stroke-width="1.5"/>
      <circle cx="350" cy="400" r="3" fill="#f5b400" opacity="0.8"/>
      <circle cx="700" cy="260" r="3" fill="#f5b400" opacity="0.8"/>
      <text x="965" y="125" class="klimt-text">Inspired by the works of Gustav Klimt</text>
    </svg>

    <section class="hero-section">
      <div class="badge">
        <span class="dot"></span>
        <span class="label">More Than An NFT</span>
      </div>
      <h1 class="hero-title">
        A Persian Handwoven Masterpiece
        <span class="sub">Now on the Blockchain</span>
      </h1>
    </section>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-number">2015</div>
        <div class="stat-label">Founded</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">1/1</div>
        <div class="stat-label">Limited Edition</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">Artist Collective</div>
        <div class="stat-label">Design & Weaving</div>
      </div>
    </div>

  </div>

</body>
</html>
