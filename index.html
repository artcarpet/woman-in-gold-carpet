<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Carpet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; }

  .navbar {
    display: flex;
    align-items: stretch;
    height: 80px;
    background: #f2f2f2;
  }

  .nav-left {
    display: flex;
    align-items: center;
    padding: 0 30px;
  }
  .logo-wrap {
    position: relative;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-wrap::before {
    content: "";
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,180,0,0.55) 0%, rgba(245,180,0,0) 70%);
    animation: pulse-glow 2.5s ease-in-out infinite;
    z-index: 0;
  }
  .logo-wrap img {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 8px;
    z-index: 1;
  }
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.25); opacity: 1; }
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-left: 40px;
    flex: 1;
  }
  .nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Consolas', 'Courier New', monospace;
  }
  .nav-links a:hover {
    color: #000;
  }

  .nav-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5b400;
    padding: 0 45px;
    text-decoration: none;
    color: #000;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 2px;
    font-family: 'Consolas', 'Courier New', monospace;
    white-space: nowrap;
  }
  .nav-cta:hover {
    background: #ffc72c;
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo-wrap">
        <img src="logo.gif" alt="Art Carpet Logo">
      </div>
    </div>
    <div class="nav-links">
      <a href="#">Collections</a>
      <a href="#">Gallery</a>
    </div>
    <a href="#" class="nav-cta">Click to Buy →</a>
  </nav>

</body>
</html>
